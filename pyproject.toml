[project]
name = "hot-deal-mcp-py"
version = "0.0.1"
description = "PlayMCP-compatible Shinhan credit card guide MCP server (FastAPI + official mcp SDK)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
