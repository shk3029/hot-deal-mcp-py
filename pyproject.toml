[project]
name = "hot-deal-mcp-py"
version = "0.0.1"
description = "KakaoTools-compatible Shinhan credit card guide MCP server (FastAPI + FastMCP)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "fastmcp==3.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["python_tests"]

[tool.hatch.build.targets.wheel]
packages = ["mci", "schemas", "domain", "kakao", "tools"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
